<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  body {
    width: 250px;
    margin: 0;
    padding: 14px 16px;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    background: #12122b;
    color: #f2f2f7;
  }
  h1 { font-size: 15px; margin: 0 0 10px; color: #ffb020; }
  .row {
    display: flex; justify-content: space-between; align-items: center;
    padding: 7px 0; border-bottom: 1px solid #2c2c4a; font-size: 13px;
  }
  .row:last-child { border-bottom: none; }
  kbd {
    background: #2c2c4a; border-radius: 6px; padding: 3px 9px;
    font-family: inherit; font-weight: 700; color: #7ee0ff;
  }
  p { font-size: 11px; color: #9a9ab8; margin: 10px 0 0; }
</style>
</head>
<body>
  <h1>⚡ PW Speed Controller</h1>
  <div class="row"><span>Speed 2×</span><kbd>↑</kbd></div>
  <div class="row"><span>Speed 1×</span><kbd>↓</kbd></div>
  <div class="row"><span>Speed 1.5×</span><kbd>↑ + ↓</kbd></div>
  <div class="row"><span>Clean view — sab hide</span><kbd>T</kbd></div>
  <p>After ↑/↓ speed locks for 3s. <b>T</b> hides EVERYTHING floating on the video (any class, even shadow DOM) — captions &amp; video stay, "T" dobara sab wapas.</p>
</body>
</html>
