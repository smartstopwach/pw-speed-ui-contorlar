<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>PW Ionic clone (shadow DOM player)</title>
<style> body { margin:0; background:#000; } ion-app { display:block; } </style>
</head>
<body>
<ion-app></ion-app>
<script>
  /* Real PW apps are Ionic web-components: the whole player UI lives inside
     SHADOW DOM with generated "sc-" prefixed classes — exactly what defeated
     class-list CSS hiding (user's screenshot #2). */
  const sr = document.querySelector('ion-app').attachShadow({ mode: 'open' });
  sr.innerHTML = `
    <div class="watch-page sc-ion-watch">
      <div class="video-col sc">
        <div class="player sc" style="position:relative;width:960px;height:540px;background:#111">
          <video id="plc" src="/test.webm" controls muted style="width:960px;height:540px"></video>
          <ion-back class="sc" style="position:absolute;top:20px;left:18px;color:#fff;font-size:26px;z-index:5">←</ion-back>
          <div class="logo sc" style="position:absolute;top:14px;right:70px;color:#fff;z-index:5">🅿Ⓦ</div>
          <ion-menu class="sc" style="position:absolute;top:18px;right:20px;color:#fff;font-size:24px;z-index:5">⋮</ion-menu>
          <div class="timechip sc" style="position:absolute;bottom:70px;left:18px;color:#fff;z-index:5">43:11 / 1:47:16 <b>1.5x</b></div>
          <div class="ask-ai sc" style="position:absolute;bottom:70px;right:70px;background:#1c1e2f;color:#fff;border:1px solid #556;border-radius:20px;padding:6px 14px;z-index:5">👤 Ask AI</div>
          <div class="bottom-bar sc" style="position:absolute;bottom:0;left:0;width:100%;height:44px;background:#0a0a14;color:#fff;display:flex;gap:22px;align-items:center;padding:0 16px;z-index:5">
            <span>⏸</span><span>⏪10</span><span>10⏩</span><span>🔊</span>
            <span style="margin-left:auto">💬 🖥 📋 ⚙ ⛶</span>
          </div>
          <div class="seek-flash sc" style="position:absolute;top:40%;left:30%;color:#fff;opacity:.7;font-size:30px;z-index:5">↺ 10s</div>
        </div>
      </div>
    </div>`;
  window.siteSet = (r) => { sr.querySelector('#plc').playbackRate = r; };
</script>
</body></html>
