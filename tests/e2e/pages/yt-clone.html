<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>YouTube clone (real player DOM structure)</title>
<style>
  body { margin:0; background:#0f0f0f; }
  .html5-video-player { position: relative; width: 960px; height: 540px; background: #000; }
  .html5-video-container video { width: 960px; height: 540px; }
  .ytp-gradient-top { position:absolute; top:0; left:0; width:100%; height:60px; background:linear-gradient(rgba(0,0,0,.6),transparent); }
  .ytp-chrome-top { position:absolute; top:8px; left:16px; color:#fff; font-family:Roboto,Arial; }
  .ytp-title { font-size:18px; font-weight:600; }
  .ytp-chrome-top-buttons { position:absolute; top:8px; right:16px; color:#fff; }
  .caption-window { position:absolute; bottom:70px; left:380px; background:rgba(0,0,0,.75); color:#fff; padding:2px 8px; font-size:16px; }
  .ytp-doubletap-ui-legacy { position:absolute; top:200px; left:80px; color:#fff; opacity:.8; font-size:28px; }
  .ytp-chrome-bottom { position:absolute; bottom:0; left:0; width:100%; height:44px; background:linear-gradient(transparent,rgba(0,0,0,.7)); color:#fff; display:flex; gap:18px; align-items:center; padding:0 12px; }
  .ytp-bezel { position:absolute; top:45%; left:47%; color:#fff; font-size:36px; opacity:.8; }
</style></head>
<body>
  <div class="ytd-player"><div class="html5-video-player">
    <div class="html5-video-container">
      <video class="video-stream html5-main-video" src="/test.webm" controls muted></video>
    </div>
    <div class="ytp-gradient-top"></div>
    <div class="ytp-chrome-top"><div class="ytp-title">INDIA'S GOT LATENT S2 EP7 ft. Nawazuddin Siddiqui...</div></div>
    <div class="ytp-chrome-top-buttons">⌛ Share ⋮</div>
    <div class="caption-window x"><span class="ytp-caption-segment">यहाँ पे भी वैसे ही तैयारी करके आया हूँ</span></div>
    <div class="ytp-doubletap-ui-legacy">⏪ 10 ⏩</div>
    <div class="ytp-bezel">▶</div>
    <div class="ytp-chrome-bottom">
      <button class="ytp-play-button">⏸</button><span>🔊</span><span>2:53 / 53:26</span>
      <span style="margin-left:auto">CC ⚙ ⛶</span>
    </div>
  </div></div>
  <script>
    window.siteSet = (r) => { document.querySelector('video').playbackRate = r; };
  </script>
</body></html>
